  bio: I'm a theoretical physicist formerly working at Los Alamos National Lab. My research interests are in nuclear structure and
    reaction mechanisms with applications to nuclear astrophysics. I received my PhD at North Carolina State University under
    the direction of Gail McLaughlin. At the University of Notre Dame I worked under the direction of Ani Aprahamian and Rebecca
    Surman. The study of nuclear models has a wide range of applicability from nuclear medicine, to stockpile stewardship
    and even the cosmos.
