- slug: bill-priedhorsky
  display_name: Bill Priedhorsky
  sort_key: priedhorsky, bill
  email: wpriedhorsky@lanl.gov
  photo: /staff/images/bill-priedhorsky.jpg
  scholar: null
  ads: https://ui.adsabs.harvard.edu/search/fq=%7B!type%3Daqp%20v%3D%24fq_database%7D&fq_database=(database%3Aastronomy%20OR%20database%3Aphysics)&p_=0&q=%20author%3A%22Priedhorsky%2C%20William%22%20%20aff%3A%22los%20alamos%22&sort=date%20desc%2C%20bibcode%20desc
  bio: "Dr. Priedhorsky has been associated with Los Alamos National Laboratory since 1978.\nHe was honored to be named a\
    \ Laboratory Fellow in 1997, and currently serves as Emeritus Advisor for the Fellows.  From 2007 to his retirement in\
    \ 2022 he was Program Director for Laboratory Directed Research and Development, managing investment in advanced R&D across\
    \ the breadth of Laboratory science and engineering. His research interests include space instrumentation, technologies\
    \ to stymie the spread of weapons of mass destruction, as well as astrophysics. He is currently engaged with the Intelligence\
    \ and Space Research division, and the Deputy Director for Science, Technology, and Engineering, mentoring young staff,\
    \ assessing the health of science and engineering at the Laboratory, and participating in space-related research.\n \n\
    Dr. Priedhorsky received a B.A. in Physics summa cum laude and Phi Beta Kappa from Whitman College in 1973, and a Ph.\
    \ D. in physics, specializing in x-ray astronomy, from the California Institute of Technology in 1978. His research has\
    \ yielded approximately 190 peer-reviewed publications.\n \nAfter joining Los Alamos as a staff member in 1978, he developed\
    \ x-ray diagnostics for laser fusion research, and discovered copious hard x-rays from CO2 laser-plasma interaction, which\
    \ guided the national program back towards shorter-wavelength lasers. After returning to space research, he discovered\
    \ a wealth of eruptions and long- term cycles in cosmic neutron stars and black holes using data from the Los Alamos Vela\
    \ 5B satellite, as well as developing instrumentation for the detection of nuclear materials in space. He discovered what\
    \ was then the closest double star in the sky, and the novel phenomenon of quasi-periodic oscillations in the brightest\
    \ x-ray star in the sky, Scorpius X-1. Notably, he led the development of photon-counting optical imagers for remote ultralow\
    \ light imaging, a project that continues to this day as “Remote Ultralow Light Imaging”. He conceived and led the development\
    \ of ALEXIS, Los Alamos’ first small satellite, launched in 1993, and the MOXE x-ray all sky monitor, which sadly never\
    \ went to space, because of the collapse of the Russian space program after the fall of the USSR. \n \nFrom 1995 to 1999,\
    \ he was Lead Project Leader for Proliferation Detection Technology, responsible for the Lab’s projects in active and\
    \ passive remote sensing, as well as Laboratory’s efforts in Hard and Deeply Buried Target Defeat. From 1999 to 2007 he\
    \ was Chief Scientist in the Nonproliferation and International Security Division, the International, Space, and Response\
    \ Divisions, and the Threat Reduction Directorate, responsible for the health of basic and applied research in space science,\
    \ proliferation detection, treaty monitoring, nuclear safeguards, and international technologies. With Chris Morris of\
    \ Physics division, he originated the idea of using cosmic-ray muons to detect nuclear material. In 2005, he received\
    \ the Leo Szilard Award of the American Physical Society for his part in their study of boost-phase missile defense, and\
    \ was named a Fellow of the Society in 2006. Whitman College awarded him their Alumnus of the year award in 1995. He has\
    \ been a Max Planck Fellow, a visiting scientist at the Danish Space Research Institute, a Lyle Fellow at the University\
    \ of Melbourne, Australia, and coordinator (elected head) of the Los Alamos National Laboratory Fellows. Priedhorsky is\
    \ an avid outdoorsman and several times president of the Los Alamos Mountaineers."
