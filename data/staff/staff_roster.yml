  lanl_profile: http://www.lanl.gov/expertise/profiles/view/wesley-even
  bio: Wes Even serves as Center Lead for the Center for Scientific Computing at Los Alamos National Laboratory, where he
    uses computer simulations to study the most spectacular explosions in the universe. After earning his Ph.D. in Physics
    from Louisiana State University in 2010, his research has focused on understanding what happens when stars collide, explode,
    or merge—events that can briefly outshine entire galaxies and forge the heavy elements that make up planets and life itself.
    His work spans the full lifecycle of these cosmic explosions, from modeling how light escapes from supernovae to predicting
    what telescopes should see when neutron stars spiral together and collide (like the famous gravitational wave event GW170817).
    Using sophisticated numerical simulations that combine radiation transport, hydrodynamics, and nuclear physics, he investigates
    fundamental questions about stellar evolution and the origins of elements in the universe.  He has previously served as
    a group manager in LANL’s Theoretical and Computing & Artificial Intelligence Divisions.
